name: Checks
on:
  push:
    branches: ['**']
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
permissions: {}
# PR updates supersede old PR checks; default-branch pushes must not cancel releases.
concurrency:
  group: checks-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
defaults:
  run:
    shell: bash
jobs:
  validate:
    name: Validate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    services:
      redis:
        image: redis:8.4.0-bookworm@sha256:0a0f28c99ae50da4e0504499d2cd5b41746135c64f28ec42c88dafad93f60d41
        ports:
          - 6379/tcp
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0, Node 24
        with:
          bun-version-file: package.json
      - name: Runner and toolchain diagnostics
        run: |
          uname -a
          cat /etc/os-release
          bun --version
          bun --revision
          docker version
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Disable Redis persistence
        env:
          REDIS_CONTAINER: ${{ job.services.redis.id }}
        run: |
          docker exec "$REDIS_CONTAINER" redis-cli CONFIG SET save ''
          docker exec "$REDIS_CONTAINER" redis-cli CONFIG SET appendonly no
          docker exec "$REDIS_CONTAINER" redis-cli INFO server
      - name: Clean frozen install
        run: |
          test ! -d node_modules
          bun install --frozen-lockfile
          git diff --exit-code -- package.json bun.lock
      - name: Workflow syntax and expressions
        run: bash scripts/checkActions.sh
      - name: Complete validation (Redis required; no skipped tests)
        env:
          KAIRO_TEST_REDIS_URL: redis://127.0.0.1:${{ job.services.redis.ports['6379'] }}
        run: bun scripts/ci.ts
      - name: Redis diagnostics
        if: failure()
        env:
          REDIS_CONTAINER: ${{ job.services.redis.id }}
        run: docker logs --tail 100 "$REDIS_CONTAINER"
      - name: Verify locked inputs remain unchanged
        run: git diff --exit-code -- package.json bun.lock
      - name: Record validated commit
        id: validated
        run: echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
    outputs:
      sha: ${{ steps.validated.outputs.sha }}

  required:
    name: Required checks
    needs: [validate]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require complete validation of this commit
        env:
          RESULT: ${{ needs.validate.result }}
          VALIDATED_SHA: ${{ needs.validate.outputs.sha }}
        run: |
          test "$RESULT" = success
          test "$VALIDATED_SHA" = "$GITHUB_SHA"
          echo "All required checks passed for $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Release Please
    needs: [validate, required]
    if: >-
      ${{ success() && needs.validate.result == 'success' &&
          needs.required.result == 'success' && needs.validate.outputs.sha == github.sha &&
          github.event_name == 'push' && github.ref_type == 'branch' &&
          github.ref_name == github.event.repository.default_branch &&
          vars.KAIRO_RELEASES == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: release-please
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      # No checkout or repository code is executed with the write token.
      - name: Reject a stale default-branch run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          EXPECTED_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          default_branch=$(gh api "repos/$GH_REPO" --jq .default_branch)
          test "$default_branch" = "$EXPECTED_BRANCH"
          encoded_branch=$(jq -rn --arg branch "$default_branch" '$branch | @uri')
          # Do not let a later green push publish an older unvalidated release merge.
          pending_shas=$(gh api --paginate "repos/$GH_REPO/pulls?state=closed&base=$encoded_branch&per_page=100" \
            --jq '.[] | select(.merged_at != null and any(.labels[]; .name == "autorelease: pending")) | .merge_commit_sha')
          while IFS= read -r pending_sha; do
            test -z "$pending_sha" || test "$pending_sha" = "$GITHUB_SHA"
          done <<< "$pending_shas"
          current_sha=$(gh api "repos/$GH_REPO/git/ref/heads/$encoded_branch" --jq .object.sha)
          test "$current_sha" = "$GITHUB_SHA"
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0, Node 24
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target-branch: ${{ github.event.repository.default_branch }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
